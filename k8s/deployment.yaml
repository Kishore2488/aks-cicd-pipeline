apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-cicd-demo
  labels:
    app: aks-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-cicd-demo
  template:
    metadata:
      labels:
        app: aks-cicd-demo
    spec:
      containers:
        - name: aks-cicd-demo
          image: ghcr.io/kishore2488/aks-cicd-pipeline:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
